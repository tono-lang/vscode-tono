name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Dormant by design: this repo has no extension code yet (no package.json,
# no src/), so this workflow has nothing to package until the extension
# itself is implemented in a separate task. It exists now so publishing is a
# non-event once that lands, rather than another manual step to remember.
jobs:
  publish:
    name: Publish to the VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
