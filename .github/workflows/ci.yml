name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Builds the grammar from the revision in grammar-pin.json, typechecks, and
      # runs the suite against both the sources and the bundled extension.
      - run: npm test
      - run: npx vsce package --out vscode-tono.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-tono.vsix

  ci-success:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check that every job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job did not pass"
            exit 1
          fi
